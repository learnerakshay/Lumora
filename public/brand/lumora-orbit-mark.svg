<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="lumora-mark-title lumora-mark-desc">
  <title id="lumora-mark-title">Lumora</title>
  <desc id="lumora-mark-desc">A symmetric cyan knowledge network arranged around a central diamond.</desc>
  <defs>
    <radialGradient id="badge" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#0c4a6e" stop-opacity=".72"/>
      <stop offset=".52" stop-color="#071426"/>
      <stop offset="1" stop-color="#030713"/>
    </radialGradient>
    <linearGradient id="network" x1="16" y1="16" x2="84" y2="84">
      <stop stop-color="#67e8f9"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset=".42" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </radialGradient>
    <filter id="soft-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#badge)" stroke="#0ea5e9" stroke-opacity=".34"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-dasharray="1 5"/>

  <g fill="none" stroke="url(#network)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="1.15" stroke-opacity=".72">
      <path d="M50 50 50 20M50 50 71.213 28.787M50 50 80 50M50 50 71.213 71.213M50 50 50 80M50 50 28.787 71.213M50 50 20 50M50 50 28.787 28.787"/>
      <path d="M50 20 71.213 28.787 80 50 71.213 71.213 50 80 28.787 71.213 20 50 28.787 28.787Z" stroke-opacity=".42"/>
    </g>
    <path d="M50 35 65 50 50 65 35 50Z" stroke-width="2" filter="url(#soft-glow)"/>
  </g>

  <g fill="#67e8f9" stroke="#e0f2fe" stroke-width=".7" filter="url(#soft-glow)">
    <circle cx="50" cy="20" r="2.2"/>
    <circle cx="71.213" cy="28.787" r="2.2"/>
    <circle cx="80" cy="50" r="2.2"/>
    <circle cx="71.213" cy="71.213" r="2.2"/>
    <circle cx="50" cy="80" r="2.2"/>
    <circle cx="28.787" cy="71.213" r="2.2"/>
    <circle cx="20" cy="50" r="2.2"/>
    <circle cx="28.787" cy="28.787" r="2.2"/>
  </g>

  <circle cx="50" cy="50" r="4" fill="url(#core)" filter="url(#soft-glow)"/>
  <circle cx="50" cy="50" r="1.35" fill="#e0f2fe"/>
</svg>
